[package]
name = "unified-gitops"
version = "0.4.0"
edition = "2024"
# MSRV, kept in lockstep with docker/Dockerfile's pinned toolchain: a language
# feature newer than the image's compiler must fail loudly at `cargo build`,
# not at the next image build.
rust-version = "1.96"
description = "GitOps for anything with an API: desired state in git, reconciled through connector scripts"
license = "Apache-2.0"
repository = "https://github.com/OpusProjects/unified-gitops"
readme = "README.md"
# This is a deployed application, not a library — never publish to crates.io
publish = false

[dependencies]
axum = "0.8"
# Basic auth header for webhook credentials. default-features = false drops
# base64's default `simd-unsafe` feature: we encode one short header per
# request, so the SIMD engines' unsafe code buys nothing here.
base64 = { version = "0.23", default-features = false, features = ["std"] }
dashmap = "6"
# Content hashes for the configuration API: a file's ETag is the sha256 of
# its bytes, so a write can be refused when someone else changed it first.
sha2 = "0.11"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
# Webhooks over HTTPS. rustls instead of openssl to keep the build
# self-contained.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive", "rc"] }   # rc: Serialize/Deserialize for Arc<T>
serde_json = "1"
serde-saphyr = "2"       # pure-Rust YAML (no unsafe-libyaml): reads config and desired state, writes the state copy
# Credential resolution (env vars, JSON files, Vault) and LDAP sign-in, shared
# with unified-api: one repository, two crates, released together, so both
# lines always name the same tag. See the auth repository's docs/development.md for
# building against a local checkout.
secrets-rs = { git = "https://github.com/OpusProjects/auth", tag = "v0.3.0" }
auth-rs = { git = "https://github.com/OpusProjects/auth", tag = "v0.3.0" }
# Git checkouts (clone, pull, commits, export), shared with unified-api. See
# the git repository's docs/development.md for building against a local
# checkout.
git-rs = { git = "https://github.com/OpusProjects/git", tag = "v0.2.0" }
tokio = { version = "1", features = ["full"] }
# The CORS middleware wraps tower-http's CorsLayer around the rest of the
# stack per request (Layer + oneshot from `util`), which is what makes the
# origin list reloadable. Already in the tree as an axum dependency — this
# adds no new code to the build.
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "trace", "compression-gzip", "request-id", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "6", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "10", features = ["axum"] }
croner = "4.0.0"
# killpg: a connector's timeout kills its whole process group, not only the
# script (a wrapper's children would outlive it). Already in the tree through
# tokio.
libc = "0.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

# [dev-dependencies] = compiled only for tests, never shipped in the production binary
[dev-dependencies]
futures = "0.3"
# test-util adds virtual time (tokio::time::pause): the scheduler's tick
# behaviour is a property of a 40-second schedule, and this exercises it in
# microseconds instead of making the suite wait
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
tower = "0.5"            # to call the app as a service (no TCP)
http-body-util = "0.1"   # to read the body of responses

