# An application: one live system, and the desired state for it in git.
applications:
  - name: demo
    description: "Demo key-value store"
    # The system: the connector that talks to it, and what the connector needs to reach it
    connector: kv
    # credentials: [cred-store]       # handed to the connector as CREDENTIAL_*
    config:
      dir: "/var/lib/unified-gitops/demo-store"
    # The desired state: a folder in a git project
    project: examples
    path: "examples/desired-state/demo"
    # Checked every 5 minutes: compares git with the system and reports drift
    sync_interval_seconds: 300
    # Apply automatically when out of sync (off: only report, and wait for Sync)
    auto_sync: false
    # Delete objects on the system that git does not declare (off by default)
    prune: false
